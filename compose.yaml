services:
  app:
    build:
      context: ./app
    environment:
      APP_NAME: ${APP_NAME}
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - web-network

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
